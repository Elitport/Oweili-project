; Oweili — PHP settings for this website (read by Hostinger's PHP from public_html).
; Bigger uploads, so artists can send their photos and videos.
; Changes take up to 5 minutes to apply. Visitors cannot open this file:
; .htaccess blocks every file whose name starts with a dot.
upload_max_filesize = 64M
post_max_size = 128M

; Never show PHP errors to visitors; write them to the private log instead
display_errors = Off
display_startup_errors = Off
log_errors = On
